<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8912d"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8a888"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#211b15"/>

  <!-- PC -->
  <rect x="30" y="30" width="285" height="190" rx="8" fill="#332a21" stroke="#e8912d" stroke-width="2"/>
  <text x="50" y="64" font-size="22" font-weight="700" fill="#f2a43a">Your PC</text>
  <text x="50" y="88" font-size="14" fill="#d8ccb4">RuneLite + Pssst Companion</text>
  <g font-size="14" fill="#f0e6d2">
    <text x="50" y="124">• Reads what the game shows you</text>
    <text x="50" y="150">• Opens no port; it only sends</text>
    <text x="50" y="176">• Off until you turn on Enable Sync</text>
    <text x="50" y="202">• Never sends input to the game</text>
  </g>

  <!-- Phone -->
  <rect x="585" y="30" width="285" height="190" rx="8" fill="#332a21" stroke="#e8912d" stroke-width="2"/>
  <text x="605" y="64" font-size="22" font-weight="700" fill="#f2a43a">Your phone</text>
  <text x="605" y="88" font-size="14" fill="#d8ccb4">Pssst app</text>
  <g font-size="14" fill="#f0e6d2">
    <text x="605" y="124">• Accepts only your network</text>
    <text x="620" y="150">and your sync token</text>
    <text x="605" y="176">• Saves the snapshot, runs timers</text>
    <text x="605" y="202">• Reminders work with the PC off</text>
  </g>

  <!-- snapshot arrow -->
  <line x1="319" y1="92" x2="579" y2="92" stroke="#e8912d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="80" font-size="15" font-weight="700" fill="#f2a43a" text-anchor="middle">Snapshot</text>
  <g font-size="12.5" fill="#d8ccb4" text-anchor="middle">
    <text x="450" y="114">POST /sync · port 8789</text>
    <text x="450" y="132">home Wi-Fi or Tailscale only</text>
    <text x="450" y="150">on change, ≤ every 2 min, and at logout</text>
  </g>

  <!-- icon request arrow -->
  <line x1="579" y1="186" x2="319" y2="186" stroke="#b8a888" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDim)"/>
  <text x="450" y="176" font-size="12.5" fill="#b8a888" text-anchor="middle">reply: “send me these icons”</text>
  <text x="450" y="206" font-size="12.5" fill="#b8a888" text-anchor="middle">drawn by your RuneLite, once each</text>

  <!-- Sent -->
  <rect x="30" y="250" width="410" height="180" rx="8" fill="#2a3a24" stroke="#5fbf4a" stroke-width="1.5"/>
  <text x="50" y="280" font-size="16" font-weight="700" fill="#7fd86a">What's sent</text>
  <g font-size="13.5" fill="#f0e6d2">
    <text x="50" y="306">• Inventory, skills, quests, GE offers</text>
    <text x="50" y="330">• Bank + potion storage (own toggle)</text>
    <text x="50" y="354">• Farming patches and birdhouses</text>
    <text x="50" y="378">• Slayer task, diaries, dailies, kingdom</text>
    <text x="50" y="402">• Item prices from RuneLite's own price data</text>
  </g>

  <!-- Never sent -->
  <rect x="460" y="250" width="410" height="180" rx="8" fill="#3a2422" stroke="#d9534f" stroke-width="1.5"/>
  <text x="480" y="280" font-size="16" font-weight="700" fill="#ef7a74">Never sent</text>
  <g font-size="13.5" fill="#f0e6d2">
    <text x="480" y="306">• Your username or login</text>
    <text x="480" y="330">• Chat or private messages</text>
    <text x="480" y="354">• Your location in the world</text>
    <text x="480" y="378">• Friends list</text>
    <text x="480" y="402">• Anything about other players</text>
  </g>

  <!-- footer -->
  <text x="450" y="468" font-size="15" font-weight="700" fill="#f2a43a" text-anchor="middle">No Pssst server · no accounts · nothing to host · the app calls no one</text>
</svg>
